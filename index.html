<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0D1117;
      --surface:  #161B22;
      --border:   #21262D;
      --chalk:    #F0EDE5;
      --muted:    #8B949E;
      --cyan:     #00E5FF;
      --amber:    #FFB300;
      --radius:   12px;
    }

    body {
      background: var(--bg);
      color: var(--chalk);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HERO ─────────────────────────────────── */
    .hero {
      position: relative;
      text-align: center;
      padding: 80px 24px 60px;
      overflow: hidden;
    }

    .hero-bg-symbol {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(200px, 35vw, 380px);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: transparent;
      -webkit-text-stroke: 1px rgba(0, 229, 255, 0.06);
      line-height: 1;
      user-select: none;
      animation: drift 20s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes drift {
      0%, 100% { transform: translate(-50%, -50%) rotate(-4deg) scale(1);   }
      33%       { transform: translate(-50%, -50%) rotate( 6deg) scale(1.03); }
      66%       { transform: translate(-50%, -50%) rotate(-2deg) scale(0.97); }
    }

    .hero-label {
      display: inline-block;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 16px;
      position: relative;
    }

    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(36px, 7vw, 72px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      position: relative;
    }

    .hero h1 em {
      font-style: normal;
      color: var(--amber);
    }

    .hero-sub {
      margin-top: 16px;
      color: var(--muted);
      font-size: 16px;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
      line-height: 1.6;
    }

    /* ── STATS BAR ────────────────────────────── */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px 24px 40px;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--cyan);
      display: block;
      transition: color 0.3s;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* ── DIVIDER ──────────────────────────────── */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      max-width: 960px;
      margin: 0 auto 48px;
    }

    /* ── GRID ─────────────────────────────────── */
    .grid-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    /* ── CARD ─────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,229,255,0.04) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .card:hover {
      border-color: rgba(0, 229, 255, 0.35);
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,229,255,0.12);
    }

    .card:hover::before { opacity: 1; }

    .card-icon {
      font-size: 28px;
      line-height: 1;
    }

    .card-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .card-tag {
      font-size: 11px;
      color: var(--cyan);
      background: rgba(0,229,255,0.08);
      border: 1px solid rgba(0,229,255,0.18);
      border-radius: 20px;
      padding: 3px 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .card-arrow {
      color: var(--muted);
      font-size: 18px;
      transition: color 0.2s, transform 0.2s;
    }

    .card:hover .card-arrow {
      color: var(--cyan);
      transform: translateX(3px);
    }

    /* ── LOADING / EMPTY STATES ───────────────── */
    .state-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .state-box .icon { font-size: 40px; margin-bottom: 16px; }
    .state-box p { font-size: 14px; line-height: 1.6; }
    .state-box a { color: var(--cyan); text-decoration: underline; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FOOTER ───────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    footer a { color: var(--cyan); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── REFRESH BTN ──────────────────────────── */
    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .refresh-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .refresh-btn svg { width: 13px; height: 13px; }

    @media (max-width: 480px) {
      .stats-bar { gap: 24px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ── HERO ─────────────────────────── -->
  <header class="hero">
    <div class="hero-bg-symbol">π</div>
    <p class="hero-label">Interactive Learning</p>
    <h1>Math <em>Games</em></h1>
    <p class="hero-sub">Browser-based games that make numbers fun. Pick one and play.</p>
  </header>

  <!-- ── STATS ─────────────────────────── -->
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-num" id="game-count">—</span>
      <span class="stat-label">Games</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="last-updated">—</span>
      <span class="stat-label">Last checked</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- ── GAME GRID ──────────────────────── -->
  <main class="grid-wrap">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;">
      <p class="section-title" style="margin-bottom:0">All games</p>
      <button class="refresh-btn" onclick="loadGames(true)" id="refresh-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        Refresh
      </button>
    </div>
    <div class="grid" id="game-grid">
      <div class="state-box">
        <div class="spinner"></div>
        <p>Checking repo for games…</p>
      </div>
    </div>
  </main>

  <!-- ── FOOTER ─────────────────────────── -->
  <footer>
    Auto-detects <code>.html</code> files in this repo via the GitHub API.
    Add a new HTML game and it appears here on next load.
    &nbsp;·&nbsp;
    <a href="https://github.com" id="repo-link" target="_blank" rel="noopener">View on GitHub</a>
  </footer>

  <script>
    // ── CONFIG ───────────────────────────────────────────────────────────────
    // Auto-detect repo from GitHub Pages URL, or hardcode below:
    // const REPO_OWNER = 'your-username';
    // const REPO_NAME  = 'your-repo';

    const EXCLUDED = ['index.html'];   // files to never show as game cards

    // Math-flavoured icons assigned by filename hash for consistency
    const ICONS = ['➕','➖','✖️','➗','π','∑','√','∞','🔢','🎲','📐','🧮','🔭','📊','💡','⚡'];

    // Fun math facts shown on empty-state or as card subtitles when no desc available
    const FACTS = [
      'A prime has no divisors other than 1 and itself.',
      '0! equals 1 by definition.',
      'π is irrational — its digits never repeat.',
      'The Fibonacci sequence appears in sunflower spirals.',
      'Every even number > 2 is the sum of two primes (Goldbach).',
      '1 is neither prime nor composite.',
      'A googol is 10 to the power of 100.',
      'The sum of all positive integers "equals" −1/12 (Ramanujan).',
    ];

    // ── REPO DETECTION ───────────────────────────────────────────────────────
    function detectRepo() {
      // GitHub Pages URLs: https://owner.github.io/repo/ or custom domain with meta
      const meta = document.querySelector('meta[name="github-repo"]');
      if (meta) {
        const [owner, name] = meta.content.split('/');
        return { owner, name };
      }

      const host = location.hostname;
      const path = location.pathname.replace(/^\/|\/$/g, '');

      if (host.endsWith('github.io')) {
        const owner = host.replace('.github.io', '');
        const name  = path.split('/')[0] || owner + '.github.io';
        return { owner, name };
      }

      // Fallback: try to read from window config
      if (typeof REPO_OWNER !== 'undefined' && typeof REPO_NAME !== 'undefined') {
        return { owner: REPO_OWNER, name: REPO_NAME };
      }

      return null;
    }

    // ── UTILITIES ─────────────────────────────────────────────────────────────
    function iconFor(filename) {
      let h = 0;
      for (const c of filename) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
      return ICONS[h % ICONS.length];
    }

    function titleFromFilename(filename) {
      return filename
        .replace(/\.html?$/i, '')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function randomFact() {
      return FACTS[Math.floor(Math.random() * FACTS.length)];
    }

    function timeAgo(date) {
      const secs = Math.floor((Date.now() - date) / 1000);
      if (secs < 60)  return 'just now';
      if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
      if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
      return Math.floor(secs / 86400) + 'd ago';
    }

    // ── RENDER ────────────────────────────────────────────────────────────────
    function renderCards(files, baseUrl) {
      const grid = document.getElementById('game-grid');

      const games = files.filter(f =>
        /\.html?$/i.test(f.name) && !EXCLUDED.includes(f.name.toLowerCase())
      );

      document.getElementById('game-count').textContent = games.length;

      if (games.length === 0) {
        grid.innerHTML = `
          <div class="state-box">
            <div class="icon">🧮</div>
            <p>No HTML games found yet.<br>
            Add <code>.html</code> files to this repo and they'll appear here automatically.</p>
          </div>`;
        return;
      }

      grid.innerHTML = games.map(f => {
        const title = titleFromFilename(f.name);
        const icon  = iconFor(f.name);
        const url   = baseUrl ? `${baseUrl}/${f.name}` : f.name;
        const desc  = randomFact(); // placeholder; replace with real descs via front-matter if you want

        return `
          <a class="card" href="${url}">
            <div class="card-icon">${icon}</div>
            <div class="card-name">${title}</div>
            <div class="card-desc">${desc}</div>
            <div class="card-footer">
              <span class="card-tag">Math Game</span>
              <span class="card-arrow">→</span>
            </div>
          </a>`;
      }).join('');
    }

    function renderError(msg) {
      document.getElementById('game-grid').innerHTML = `
        <div class="state-box">
          <div class="icon">⚠️</div>
          <p>${msg}</p>
        </div>`;
      document.getElementById('game-count').textContent = '?';
    }

    // ── FETCH ─────────────────────────────────────────────────────────────────
    async function loadGames(force = false) {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.querySelector('svg').style.animation = 'spin 0.6s linear infinite';

      // Cache: skip network if loaded <5 min ago (unless forced)
      const CACHE_KEY = 'math_games_cache';
      if (!force) {
        try {
          const cached = JSON.parse(sessionStorage.getItem(CACHE_KEY) || 'null');
          if (cached && Date.now() - cached.ts < 5 * 60 * 1000) {
            renderCards(cached.files, cached.baseUrl);
            document.getElementById('last-updated').textContent = timeAgo(cached.ts);
            document.getElementById('repo-link').href = cached.repoUrl || 'https://github.com';
            btn.disabled = false;
            btn.querySelector('svg').style.animation = '';
            return;
          }
        } catch {}
      }

      const repo = detectRepo();

      if (!repo) {
        // Dev / local mode — scan for href links as fallback
        renderError(`
          Couldn't detect a GitHub repo.<br>
          Add <code>&lt;meta name="github-repo" content="owner/repo"&gt;</code> to the
          <code>&lt;head&gt;</code>, or host on GitHub Pages.
        `);
        document.getElementById('game-count').textContent = '?';
        btn.disabled = false;
        btn.querySelector('svg').style.animation = '';
        return;
      }

      const { owner, name } = repo;
      const apiUrl  = `https://api.github.com/repos/${owner}/${name}/contents/`;
      const repoUrl = `https://github.com/${owner}/${name}`;
      const baseUrl = `https://${owner}.github.io/${name}`;

      document.getElementById('repo-link').href = repoUrl;

      try {
        const res = await fetch(apiUrl, {
          headers: { Accept: 'application/vnd.github.v3+json' }
        });

        if (res.status === 403) throw new Error('GitHub API rate limited. Try again in a minute.');
        if (res.status === 404) throw new Error(`Repo <strong>${owner}/${name}</strong> not found or is private.`);
        if (!res.ok) throw new Error(`GitHub API returned ${res.status}.`);

        const files = await res.json();
        const now = Date.now();

        // Cache result
        try {
          sessionStorage.setItem(CACHE_KEY, JSON.stringify({ files, baseUrl, repoUrl, ts: now }));
        } catch {}

        renderCards(files, baseUrl);
        document.getElementById('last-updated').textContent = timeAgo(now);

      } catch (err) {
        renderError(err.message || 'Failed to load games.');
      }

      btn.disabled = false;
      btn.querySelector('svg').style.animation = '';
    }

    // ── INIT ──────────────────────────────────────────────────────────────────
    loadGames();

    // Auto-refresh every 5 minutes while the page is open
    setInterval(() => loadGames(true), 5 * 60 * 1000);
  </script>
</body>
</html>
